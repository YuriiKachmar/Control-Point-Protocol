const status = t => document.getElementById('status').textContent = t;

async function generateVectorPDF() {
status('⏳ Генерую векторний PDF...');
try {
const { jsPDF } = window.jspdf;
const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

// Додаємо шрифти з кирилицею
pdf.addFileToVFS('Arsenal-Regular.ttf', FONT_REGULAR);
pdf.addFont('Arsenal-Regular.ttf', 'Arsenal', 'normal');
pdf.addFileToVFS('Arsenal-Bold.ttf', FONT_BOLD);
pdf.addFont('Arsenal-Bold.ttf', 'Arsenal', 'bold');
pdf.setFont('Arsenal', 'normal');

const lM=25, rM=10, tM=20, pageW=210, pageH=297;
const w = pageW - lM - rM; // 175mm
let y = tM;

function line(txt, sz=10, bold=false, align='left') {
pdf.setFontSize(sz);
pdf.setFont('Arsenal', bold ? 'bold' : 'normal');
const lines = pdf.splitTextToSize(String(txt||''), w);
lines.forEach(l => {
if (y > pageH - 15) { pdf.addPage(); y = tM; }
const x = align === 'center' ? pageW/2 : lM;
pdf.text(l, x, y, align === 'center' ? {align:'center'} : {});
y += sz * 0.42;
});
y += 2;
}

function hLine() {
pdf.setDrawColor(200,200,200);
pdf.line(lM, y, pageW-rM, y);
y += 4;
}

// Заголовок
line('ПРОТОКОЛ НАРАДИ №3', 14, true, 'center');
line('Щодо ходу робіт на об\'єкті:', 10, false, 'center');
line('Готель', 11, true, 'center');
line('Замарстинівська 25', 9, false, 'center');
y += 3;

// Дата і місце
pdf.setFontSize(9); pdf.setFont('Arsenal','normal');
pdf.text('29 квітня 2026 р.', lM, y);
pdf.text('Львів', pageW-rM, y, {align:'right'});
y += 8;

// Таблиця — заголовок
const cols = [8, 70, 30, 50, 17]; // ширини колонок мм
const colX = [lM];
cols.forEach((c,i) => { if(i>0) colX.push(colX[i-1]+cols[i-1]); });
const rowH = 8;

// Шапка таблиці
pdf.setFillColor(30,58,95);
pdf.rect(lM, y, w, rowH, 'F');
pdf.setTextColor(255,255,255);
pdf.setFontSize(8); pdf.setFont('Arsenal','bold');
['№','Опис / питання','Виконавець','Прийняте рішення','Прим.'].forEach((h,i) => {
pdf.text(h, colX[i]+2, y+5.5);
});
pdf.setTextColor(0,0,0);
y += rowH;

// Рядки таблиці
const rows = [
['1','Попередження','Петро','Зробити до 09.05.2026',''],
['2','рлрлр','Л.Я.','отор',''],
];
rows.forEach((row, ri) => {
if (ri%2===1) { pdf.setFillColor(248,248,248); pdf.rect(lM,y,w,rowH,'F'); }
pdf.setFontSize(9); pdf.setFont('Arsenal','normal');
row.forEach((cell,i) => { pdf.text(String(cell), colX[i]+2, y+5.5); });
pdf.setDrawColor(200,200,200);
pdf.rect(lM, y, w, rowH);
y += rowH;
});
y += 6;

// Присутні
line('Погоджено та затверджено присутніми:', 10, true);
y += 2;
['Л.Я.','М. Мельник'].forEach(name => {
pdf.setFontSize(10); pdf.setFont('Arsenal','bold');
pdf.text(name, lM, y);
pdf.setDrawColor(0,0,0);
pdf.line(lM+60, y+1, lM+120, y+1);
pdf.setFontSize(7); pdf.setFont('Arsenal','normal'); pdf.setTextColor(150,150,150);
pdf.text('підпис', lM+73, y-1);
pdf.line(lM+125, y+1, lM+155, y+1);
pdf.text('дата', lM+130, y-1);
pdf.setTextColor(0,0,0);
pdf.setDrawColor(200,200,200);
pdf.line(lM, y+5, pageW-rM, y+5);
y += 12;
});

// Додатки
y += 4;
pdf.setDrawColor(200,200,200);
pdf.line(lM, y, pageW-rM, y); y += 4;
line('Додатки:', 10, true);
line('Додаток 1 — Вузол 1', 9);

// Генеруємо Blob
const blob = pdf.output('blob');
status('✅ PDF готовий (' + Math.round(blob.size/1024) + ' KB) — передаю...');

const file = new File([blob], 'Протокол_№3.pdf', {type:'application/pdf'});
const url = URL.createObjectURL(blob);

// Показуємо debug інфо
const ua = navigator.userAgent;
const isIPhone = /iPhone/.test(ua);
const isIPad = /iPad/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const hasShare = typeof navigator.share === 'function';
status(`iPhone:${isIPhone} iPad:${isIPad} share:${hasShare}`);

if (hasShare) {
try {
await navigator.share({files:[file]});
status('✅ Передано!');
setTimeout(()=>URL.revokeObjectURL(url), 5000);
return;
} catch(e) {
status('❌ '+e.name+': '+e.message);
if (e.name==='AbortError') { URL.revokeObjectURL(url); return; }
}
}

// Комп'ютер — пряме завантаження
const a = document.createElement('a');
a.href = url; a.download = 'Протокол_№3.pdf'; a.click();
status('✅ PDF завантажується...');
setTimeout(()=>URL.revokeObjectURL(url), 10000);

} catch(e) {
status('❌ Помилка: ' + e.message);
console.error(e);
}
}
</script>

<title>ПРОТОКОЛ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body { font-family: 'Arsenal', Arial, sans-serif; background: #9CA3AF; color: #1a1a2e; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; }
body > :not(.screen):not(.modal-overlay):not(#toast):not(script):not(style) { display: none !important; }
.screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
.screen.active { display: flex; }

:root {
--tile-1: #DBEAFE; --tile-1d: #1E3A8A; --tile-1m: #3B82F6;
--tile-2: #F3E8FF; --tile-2d: #581C87; --tile-2m: #A855F7;
--tile-3: #DCFCE7; --tile-3d: #14532D; --tile-3m: #22C55E;
--tile-4: #FEF9C3; --tile-4d: #78350F; --tile-4m: #CA8A04;
--tile-5: #FFE4E6; --tile-5d: #881337; --tile-5m: #F43F5E;
--tile-6: #CCFBF1; --tile-6d: #134E4A; --tile-6m: #14B8A6;
--tile-7: #FEE2E2; --tile-7d: #7F1D1D; --tile-7m: #EF4444;
--tile-8: #E0E7FF; --tile-8d: #312E81; --tile-8m: #6366F1;
}

.app-header { padding: 10px 16px; padding-top: max(10px, calc(env(safe-area-inset-top) + 6px)); display: flex; align-items: center; justify-content: space-between; background: #2D2D2D; color: white; }
.back-btn { font-size: 13px; cursor: pointer; padding: 4px 9px; border-radius: 7px; border: none; background: rgba(255,255,255,0.1); color: white; }
.fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: #2563eb; color: white; border: none; border-radius: 16px; font-size: 28px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); z-index: 1000; }

.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #1e3a5f; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 200; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Повний CSS з вашого файлу (скорочено для відповіді, але в реальному файлі він весь) */
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- Весь ваш HTML з екранами -->

<div id="screen-print" class="screen">
 <div class="app-header neutral">
   <div class="app-header-left">
     <button class="back-btn" onclick="leavePrintScreen()">← Назад</button>
   </div>
   <div class="app-header-right">
     <div class="app-header-title">Відправити</div>
   </div>
 </div>
 <div id="print-preview-area" class="scroll-area no-fab">
   <div id="protocol-doc"></div>
 </div>
 <div style="position:fixed;bottom:24px;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:0 16px;z-index:50;">
   <button id="btn-print" onclick="printDocument()" style="flex:1;max-width:180px;padding:14px;background:#2563eb;color:white;border:none;border-radius:14px;font-size:15px;font-weight:700;">🖨 Друкувати</button>
   <button id="btn-save" onclick="savePDF()" style="flex:1;max-width:180px;padding:14px;background:white;color:#2563eb;border:2px solid #2563eb;border-radius:14px;font-size:15px;font-weight:700;">💾 Зберегти PDF</button>
 </div>
</div>

<div id="toast"></div>
<div id="global-spinner" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;color:white;">Завантаження...</div>

<script>
// Firebase config
const firebaseConfig = {
 apiKey: "AIzaSyCKE_X9DaSHEH7tpJ07mfPSKJUJH7ZxTkM",
 authDomain: "control-point-app.firebaseapp.com",
 projectId: "control-point-app",
 storageBucket: "control-point-app.firebasestorage.app",
 messagingSenderId: "756000624671",
 appId: "1:756000624671:web:55a70d705b332dcc4f452a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentProject = null;
let currentMeeting = null;

// Показ екрану
function showScreen(id) {
 document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
 const screen = document.getElementById(id);
 if (screen) screen.classList.add('active');
}

// Toast
function showToast(msg, dur = 2200) {
 const t = document.getElementById('toast');
 t.textContent = msg;
 t.classList.add('show');
 setTimeout(() => t.classList.remove('show'), dur);
}

// Друк для iPad / мобільних
window.printDocument = function() {
 showToast('Підготовка до друку...', 800);
 setTimeout(() => window.print(), 900);
};

// Збереження PDF
window.savePDF = function() {
 const btn = document.getElementById('btn-save');
 btn.disabled = true;
 btn.textContent = '⏳ Генерація...';

 html2pdf().from(document.getElementById('protocol-doc')).save(`Протокол_№${currentMeeting?.number || ''}.pdf`).then(() => {
   btn.disabled = false;
   btn.textContent = '💾 Зберегти PDF';
   showToast('PDF збережено');
 }).catch(() => {
   btn.disabled = false;
   btn.textContent = '💾 Зберегти PDF';
   showToast('Помилка створення PDF');
 });
};

console.log("%cПРОТОКОЛ — готовий файл", "color:#2563eb;font-weight:bold");
</script>
</body>
</html>
